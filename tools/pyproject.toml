[project]
name = "omp-tools"
version = "0.1.0"
description = "Open Machine Protocol tooling - omp-validate and omp-simulate"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=1.6"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
omp-validate = "omp_tools.validate:main"
omp-simulate = "omp_tools.simulate:main"
omp-sniff = "omp_tools.sniff:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omp_tools*"]
