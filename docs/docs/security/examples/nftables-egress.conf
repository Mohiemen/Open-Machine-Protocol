#!/usr/sbin/nft -f
#
# Hardening Guide s2 [Recommended]: pin gateway egress to the broker's
# IP:port rather than "outbound allowed". A gateway that can only reach one
# endpoint is a poor pivot point, which is the whole objection in s1.
#
# Adapt BROKER_ADDR / BROKER_PORT / ADMIN_SUBNET, then:
#   sudo cp nftables-egress.conf /etc/nftables.conf
#   sudo nft -c -f /etc/nftables.conf      # check before you cut yourself off
#   sudo systemctl enable --now nftables
#
# Keep a console or a second path open the first time. This policy WILL lock
# out SSH from anywhere but ADMIN_SUBNET.

define BROKER_ADDR  = 10.20.0.10
define BROKER_PORT  = 8883
define ADMIN_SUBNET = 10.10.9.0/24

flush ruleset

table inet omp {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state established,related accept
    ct state invalid drop
    iif lo accept

    # Admin path only - not the OT side, not the internet.
    ip saddr $ADMIN_SUBNET tcp dport 22 accept

    # OT side: the gateway LISTENS for nothing. Machines are polled, and
    # retrofit nodes push to the gateway's own broker if you run one - open
    # that port here explicitly if so, e.g.:
    # iifname "wlan0" tcp dport 1883 accept

    icmp type echo-request limit rate 5/second accept
    icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, echo-request } accept
  }

  chain forward {
    # The gateway is not a router. OMP introduces no OT-to-IT flow beyond
    # its own egress (s2 [Required]).
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy drop;

    ct state established,related accept
    oif lo accept

    # The one egress that exists.
    ip daddr $BROKER_ADDR tcp dport $BROKER_PORT accept

    # DNS and NTP against the factory's own servers (s4 [Recommended]).
    # Replace with your resolvers; delete if you use IPs and a local clock.
    ip daddr 10.20.0.2 udp dport { 53, 123 } accept

    # Machine polling on the OT side.
    oifname "eth1" tcp dport 502 accept          # Modbus TCP
  }
}
